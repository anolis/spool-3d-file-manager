name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node node_modules/electron/install.js
      - run: xvfb-run -a npm run test:desktop
        env:
          SPOOL_TEST_NO_SANDBOX: 1
